[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install && pnpm --filter @rohankumar4179/engram-sdk build && pnpm --filter @engram/web build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-APP.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
